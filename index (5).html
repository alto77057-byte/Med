const pages={
home:()=>`<section class="hero"><svg class="hg" viewBox="0 0 400 200" aria-hidden="true"><use href="#g"/></svg><p class="eyebrow">For MBBS students</p><h1>Learn medicine smarter, anywhere.</h1><p style="margin-top:12px;font-size:14px;opacity:.9">An AI tutor, MCQs, notes and flashcards in one smooth app.</p><div style="margin-top:18px;display:flex;gap:10px"><a class="btn w" href="#tutor">Ask the AI tutor</a><a class="btn o" href="#mcq">Try MCQs</a></div></section>
<section class="grid2">${[["dashboard","📊","Progress","Streaks and accuracy"],["tutor","🤖","AI Tutor","Ask anything"],["subjects","📚","Subjects","All professional years"],["mcq","✅","MCQ Practice","Test yourself"],["notes","📝","Study Notes","High-yield summaries"],["flashcards","🃏","Flashcards","Quick revision"],["vitals","❤️","Vitals Check","Pulse and blood pressure"]].map(f=>`<a class="card" href="#${f[0]}"><div class="ic">${f[1]}</div><h2>${f[2]}</h2><p class="sm">${f[3]}</p></a>`).join("")}</section>
<p class="sm" style="text-align:center;margin-top:20px">For learning only, not medical advice. AI answers can contain mistakes: verify with your textbooks.</p>`,
dashboard:()=>{const a=P.done?Math.round(P.ok/P.done*100):0,tn=P.td==iso(new Date())?P.tn:0,ks=Object.keys(P.subj);
return T("Your progress","Saved on this device as you practise.")+`<div class="card row" style="gap:18px"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--border)" stroke-width="9"/><circle cx="48" cy="48" r="40" fill="none" stroke="var(--teal)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${a*2.513} 251.3" transform="rotate(-90 48 48)" style="transition:stroke-dasharray 1s"/><text x="48" y="54" text-anchor="middle" font-family="Sora,sans-serif" font-weight="700" font-size="20" fill="var(--navy)">${a}%</text></svg><div><h2 style="margin:0;font-size:16px">Accuracy</h2><p class="sm" style="margin-top:4px">${P.ok} correct of ${P.done} answered</p></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div class="card stat"><div class="disp">${streak()}🔥</div><div class="sm">Day streak</div></div><div class="card stat"><div class="disp">${P.done}</div><div class="sm">MCQs done</div></div></div>
<div class="hero" style="padding:20px;margin-top:14px"><p class="eyebrow">Today’s goal</p><p class="disp" style="font-size:18px;margin:4px 0 10px">Answer 10 MCQs · ${Math.min(tn,10)}/10</p><div class="bar" style="background:#fff3"><div style="width:${Math.min(tn,10)*10}%;background:#fff"></div></div><a class="btn w" style="margin-top:14px" href="#mcq">Continue</a></div>
<h2 style="color:var(--navy);margin:22px 0 12px;font-size:18px">Subject mastery</h2>${ks.length?`<div class="stack">${ks.map(k=>{const v=P.subj[k],p=Math.round(v[0]/v[1]*100);return`<div class="card"><div class="row" style="justify-content:space-between;font-weight:600;font-size:14px"><span>${k}</span><span class="teal">${p}%</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join("")}</div>`:`<div class="card sm" style="text-align:center;padding:24px">Answer a few MCQs and your subject mastery will appear here.</div>`}`},
tutor:()=>T("AI Tutor","Pick a mode, then ask or upload a picture.")+`<div class="chips" id="modes"></div><div id="dc"></div><div id="msgs" class="stack"></div><div style="height:110px"></div><div class="chatbar"><div class="wrap" id="pv"></div><form class="wrap" onsubmit="send(event)"><label class="cam" for="fi">📷</label><input id="fi" type="file" accept="image/*" hidden onchange="pickImg(this.files[0]);this.value=''"><input id="q" placeholder="Ask anything…" autocomplete="off"><button id="sb">Send</button></form></div>`,
vitals:()=>T("Vitals Check","Learn what pulse and blood pressure numbers mean.")+`<div class="card"><h3 style="margin:0 0 4px">🫀 Pulse counter</h3><p class="sm">Find the pulse at the wrist, then tap the big button with every beat for 15 seconds.</p><button id="ptap" class="ptap" onclick="pulseTap()"></button><button class="btn t" style="margin-top:10px;width:100%" onclick="pulseStart()">Start 15-second count</button></div>
<div class="card" style="margin-top:12px"><h3 style="margin:0 0 10px">Check your numbers</h3><div class="fld"><div><label for="hr">Heart rate (bpm)</label><input id="hr" type="number" inputmode="numeric" placeholder="72"></div><div><label for="sy">Systolic</label><input id="sy" type="number" inputmode="numeric" placeholder="120"></div><div><label for="di">Diastolic</label><input id="di" type="number" inputmode="numeric" placeholder="80"></div></div><button class="btn n" style="margin-top:12px;width:100%" onclick="vcheck()">Check</button><div id="vres"></div></div>
<div class="card sm" style="margin-top:12px;line-height:1.7"><b style="color:var(--navy)">Adult BP categories (mmHg)</b><br>Normal: below 120 and below 80<br>Elevated: 120–129 and below 80<br>Stage 1: 130–139 or 80–89<br>Stage 2: 140 or more, or 90 or more<br>Crisis: above 180 or above 120</div>
<p class="sm" style="text-align:center;margin-top:16px">For learning only, not a diagnosis. Readings aren’t saved. If you feel unwell, see a doctor. For chest pain, trouble breathing or fainting, call emergency services.</p>`,
subjects:()=>T("MBBS Subjects","Choose a subject to study.")+`<div class="chips">${["All","1st Prof","2nd Prof","3rd Prof","Final Prof"].map(y=>`<button class="chip ${y==S.year?"act":""}" onclick="S.year='${y}';render()">${y}</button>`).join("")}</div><div class="stack">${subjects.filter(s=>S.year=="All"||s[1]==S.year).map(s=>`<div class="card row"><div class="ic" style="width:48px;height:48px">${s[3]}</div><div style="flex:1"><h3 style="margin:0">${s[0]}</h3><p class="sm">${s[1]} · ${s[2]} topics</p></div><a href="#notes" class="teal" style="font-weight:700;font-size:14px">Notes →</a></div>`).join("")}</div>`,
mcq:()=>{if(!S.order)S.order=[...mcqs.keys()].sort(()=>Math.random()-.5);
if(S.qi>=S.order.length)return`<div class="hero" style="text-align:center"><p class="eyebrow">Quiz complete</p><p class="disp big">${S.score}/${S.order.length}</p><p style="font-size:14px;opacity:.9;margin-bottom:16px">${S.score==S.order.length?"Perfect round! 🎉":"Nice work. Review the explanations and go again."}</p><button class="btn w" onclick="restart()">Try again</button></div>`;
const q=mcqs[S.order[S.qi]],d=S.picked!==null;
return T("MCQ Practice",`Question ${S.qi+1} of ${S.order.length} · Score ${S.score}`)+`<span class="badge">${q.s}</span><div class="bar" style="height:6px"><div style="width:${S.qi/S.order.length*100}%"></div></div><p style="font-size:18px;font-weight:600;margin:18px 0 14px;line-height:1.4">${q.q}</p><div class="stack">${q.o.map((o,i)=>`<button class="opt ${d&&i==q.a?"ok":S.picked===i?"bad":""}" onclick="pick(${i})"><b class="teal">${"ABCD"[i]}.</b> ${o}</button>`).join("")}</div>${d?`<div class="explain"><b>${S.picked==q.a?"Correct! ":"Not quite. "}</b>${q.e}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn n" style="flex:1" onclick="S.qi++;S.picked=null;render()">Next</button><button class="btn t" onclick="explain()">Ask AI 🤖</button></div></div>`:""}`},
notes:()=>T("Study Notes","Tap a note to expand it, or upload your own PDF.")+PDFCARD()+`<div class="stack">${notes.map(n=>`<div class="card" style="padding:0"><button style="width:100%;text-align:left;padding:16px;display:flex;align-items:center;gap:10px" onclick="this.parentNode.classList.toggle('open')"><span style="flex:1"><p class="teal" style="font-size:11px;font-weight:700;text-transform:uppercase">${n.s}</p><h3 style="margin:2px 0;font-size:16px">${n.t}</h3><p class="sm">${n.d}</p></span><span class="car teal">▶</span></button><div class="nb"><div><ul style="border-top:1px solid var(--border);padding:8px 16px 12px">${n.p.map(p=>`<li><span class="teal">• </span>${p}</li>`).join("")}</ul></div></div></div>`).join("")}</div>`,
flashcards:()=>{const c=cards[S.ci];return T("Flashcards",`Card ${S.ci+1} of ${cards.length} · tap to flip`)+`<div class="fc" onclick="this.classList.toggle('f')"><div class="fi"><div class="fa"><div><p class="eyebrow">Question</p><p class="t">${c[0]}</p></div></div><div class="fb"><div><p class="eyebrow">Answer</p><p class="t">${c[1]}</p></div></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button class="btn card" style="color:var(--navy);text-align:center" onclick="go(-1)">← Previous</button><button class="btn n" onclick="go(1)">Next →</button></div>`}
};

function pick(i){if(S.picked!==null)return;const q=mcqs[S.order[S.qi]],ok=i==q.a;S.picked=i;if(ok)S.score++;
 const t=iso(new Date());if(P.td!=t){P.td=t;P.tn=0}P.tn++;P.done++;if(ok)P.ok++;const v=P.subj[q.s]||[0,0];v[1]++;if(ok)v[0]++;P.subj[q.s]=v;if(!P.days.includes(t))P.days.push(t);save();render()}
function restart(){S.order=null;S.qi=0;S.score=0;S.picked=null;render()}
function go(d){S.ci=(S.ci+d+cards.length)%cards.length;render()}
function explain(){const q=mcqs[S.order[S.qi]];S.pend="Explain this MCQ and why each wrong option is wrong: "+q.q+" Options: "+q.o.join("; ")+". Correct answer: "+q.o[q.a]+".";location.hash="tutor"}

async function loadPdf(f){if(!f)return;const st=$("#pdfst");
 if(!window.pdfjsLib){st.textContent="The PDF reader couldn’t load. Check your connection and try again.";return}
 if(f.size>2e7){st.textContent="That file is too large. Try a PDF under 20 MB.";return}
 st.textContent="Reading your PDF…";
 try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";
  for(let i=1;i<=pdf.numPages&&t.length<20000;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n"}
  t=t.replace(/[ \t]+/g," ").trim();
  if(t.length<50){st.textContent="No readable text found. For scanned pages, upload them as pictures in the AI Tutor (📷).";return}
  S.doc={name:f.name,pages:pdf.numPages,text:t.slice(0,20000),cut:t.length>=20000};render()
 }catch(e){st.textContent="I couldn’t read that PDF. It may be protected or damaged. Try another file."}}
function docAsk(j){S.pend=DOCQ[j][1];location.hash="tutor"}
function drawDoc(){const el=$("#dc");if(el)el.innerHTML=S.doc?`<div style="margin-bottom:12px"><span class="badge">📄 ${esc(S.doc.name)}</span> <button class="mini" style="margin:0 0 0 6px" onclick="S.doc=null;drawDoc()">Remove</button></div>`:""}
let PT={n:0,left:0,id:0};
function pulseUI(){const b=$("#ptap");if(!b)return;b.innerHTML=PT.left>0?`<span class="disp" style="font-size:36px">${PT.n}</span><br><span class="sm">beats · ${PT.left}s left</span>`:PT.n?`<span class="disp" style="font-size:36px">${PT.n*4}</span><br><span class="sm">bpm (${PT.n} beats × 4)</span>`:'<span class="sm">Tap Start, then tap here with every beat you feel</span>'}
function pulseStart(){clearInterval(PT.id);PT.n=0;PT.left=15;pulseUI();PT.id=setInterval(()=>{PT.left--;if(PT.left<=0){clearInterval(PT.id);const h=$("#hr");if(h&&PT.n){h.value=PT.n*4;vcheck()}}pulseUI()},1000)}
function pulseTap(){if(PT.left>0){PT.n++;pulseUI();navigator.vibrate&&navigator.vibrate(15)}}
const vres=(c,t,l,m)=>`<div class="res ${c}"><b>${t}:</b> ${l}<p>${m}</p></div>`;
function vcheck(){const hr=+$("#hr").value,s=+$("#sy").value,d=+$("#di").value;let o="";
 if(hr>0){const r=hr<40||hr>150?["bad","Very unusual at rest","Please get medical advice, especially with dizziness, chest pain or breathlessness."]:hr<60?["warn","Low (bradycardia)","Can be normal in athletes and during sleep. See a doctor if you feel faint, weak or short of breath."]:hr<=100?["ok","Normal","A typical adult resting heart rate is 60–100 beats per minute."]:["warn","High (tachycardia)","Common after exercise, caffeine, fever, anxiety or pain. If it stays high while resting, see a doctor."];o+=vres(r[0],"Heart rate "+hr+" bpm",r[1],r[2])}
 if(s>0&&d>0){if(s<=d)o+=vres("warn","Blood pressure","Check the numbers","Systolic (top) should be higher than diastolic (bottom).");else{
  const r=s>180||d>120?["bad","Hypertensive crisis range","Get medical help urgently. With chest pain, breathlessness, weakness, confusion or trouble speaking, call emergency services."]:s>=140||d>=90?["bad","Stage 2 high","See a doctor to confirm and discuss treatment."]:s>=130||d>=80?["warn","Stage 1 high","Worth rechecking on different days and discussing with a doctor."]:s>=120?["warn","Elevated","Salt, sleep, exercise and weight all matter at this level."]:s<90||d<60?["warn","Low","Can be normal for some people. See a doctor if you feel dizzy or faint."]:["ok","Normal","Below 120/80 is the normal adult range."];
  const pp=s-d,map=Math.round(d+pp/3);
  o+=vres(r[0],"Blood pressure "+s+"/"+d,r[1],r[2]+"<br><span style='font-size:12px;opacity:.85'>Pulse pressure "+pp+" mmHg (usually about 40). Mean arterial pressure "+map+" mmHg (the average pressure pushing blood to your organs; about 70–100 is typical).</span>")}}
 $("#vres").innerHTML=o?o+'<button class="btn t" style="margin-top:12px;width:100%" onclick="explainVitals()">Explain my numbers 🤖</button>':'<p class="sm" style="margin-top:12px">Enter a heart rate, or both blood pressure numbers.</p>'}
function explainVitals(){const h=$("#hr").value,s=$("#sy").value,d=$("#di").value,p=[];if(h)p.push("heart rate "+h+" bpm");if(s&&d)p.push("blood pressure "+s+"/"+d+" mmHg");S.pend="Explain in simple words what these numbers mean, with real-life examples, and why they matter: "+p.join(" and ")+". Also explain how pulse pressure and mean arterial pressure are calculated.";location.hash="tutor"}
function drawModes(){const el=$("#modes");if(el)el.innerHTML=MODES.map(m=>`<button class="chip ${S.mode==m[0]?"act":""}" onclick="S.mode='${m[0]}';drawModes()">${m[1]}</button>`).join("")}
function showPv(){const el=$("#pv");if(el)el.innerHTML=IMG?`<div class="pv"><img src="${IMG}" alt=""><button type="button" onclick="IMG=null;showPv()">✕</button></div>`:""}
function pickImg(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL("image/jpeg",.8);showPv()};im.src=r.result};r.readAsDataURL(f)}
function drawMsgs(){const box=$("#msgs");if(!box)return;const near=innerHeight+scrollY>document.body.scrollHeight-160;
 const last=S.msgs.length-1;
 box.innerHTML=S.msgs.map((m,i)=>`<div class="msg ${m.r=="user"?"me":""} ${i>=S.seen?"new":""}">${m.img?`<img class="up" src="${m.img}" alt=""><br>`:""}${m.c?md(m.c):'<span class="dots"><i></i><i></i><i></i></span>'}${m.r=="assistant"&&i==last&&i>0&&!S.busy&&m.c?`<div class="qa">${QA.map((q,j)=>`<button class="mini" onclick="ask(QA[${j}][1])">${q[0]}</button>`).join("")}</div>`:""}</div>`).join("")+(S.msgs.length==1?`<div class="chips" style="margin-top:14px;flex-wrap:wrap">${SUG.map((s,i)=>`<button class="chip" onclick="ask(SUG[${i}])">${s}</button>`).join("")}</div>`:"");
 S.seen=S.msgs.length;$("#sb").textContent=S.busy?"Stop":"Send";if(near||S.busy)scrollTo({top:document.body.scrollHeight})}
function send(e){e.preventDefault();if(S.busy){S.ctl&&S.ctl.abort();return}const i=$("#q"),v=i.value.trim()||(IMG?"Explain this image simply.":"");if(!v)return;i.value="";ask(v)}
async function ask(t){if(S.busy)return;const img=IMG;IMG=null;showPv();
 S.msgs.push({r:"user",c:t,img});const a={r:"assistant",c:""};S.msgs.push(a);S.busy=1;drawMsgs();
 const h=S.msgs.slice(0,-1).slice(-10);while(h.length&&h[0].r!="user")h.shift();
 S.ctl=new AbortController();
 try{const res=await fetch("/api/tutor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:S.mode,image:img,doc:S.doc&&S.doc.text,messages:h.map(x=>({role:x.r,content:x.c}))}),signal:S.ctl.signal});
  if(!res.ok)throw new Error(res.status==429?"rate":"http");
  const rd=res.body.getReader(),dec=new TextDecoder();
  for(;;){const{done,value}=await rd.read();if(done)break;a.c+=dec.decode(value,{stream:true});drawMsgs()}
 }catch(e){
  if(e&&e.name=="AbortError")a.c=a.c||"(Stopped)";
  else if(e&&e.message=="rate")a.c="You’re asking very quickly. Please wait a minute and try again.";
  else a.c=(a.c||"")+"\n\n⚠️ I couldn’t finish that answer. Please try again in a moment."}
 S.busy=0;drawMsgs()}

function render(anim){const r=location.hash.slice(1)||"home",p=pages[r]?r:"home",el=$("#app");
 el.innerHTML=pages[p]();el.classList.toggle("enter",!!anim);
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+p));
 if(p=="vitals")pulseUI();if(p=="tutor"){drawModes();drawDoc();showPv();drawMsgs();if(S.pend){const t=S.pend;S.pend=null;ask(t)}}}
addEventListener("hashchange",()=>{const f=()=>{render(1);scrollTo(0,0)};document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches?document.startViewTransition(f):f()});
let tk=0;addEventListener("scroll",()=>{if(!tk){tk=1;requestAnimationFrame(()=>{document.documentElement.style.setProperty("--sy",scrollY);tk=0})}},{passive:true});render(1);
</script>
</body>
</html>
